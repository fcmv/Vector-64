name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build · linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # ENGINE_NATIVE=OFF: this artifact is downloaded and executed by the
      # correctness jobs below, which land on *different* runner CPUs. A
      # -march=native build would bake in the build runner's ISA and SIGILL on
      # any older downstream runner. The portable baseline (magic bitboards +
      # scalar NNUE via the compile-time fallbacks) runs everywhere and keeps
      # the same deterministic node counts.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF -DBUILD_TESTING=ON -DENGINE_VARIANTS=ON -DENGINE_VIZ=ON && cmake --build build -j
      - name: Full native correctness suite
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 180
      - name: Both deterministic search fingerprints
        run: |
          bash tools/bench_signature.sh build/bin/ChessEngine
          bash tools/bench_signature.sh build/bin/ChessEngine-nnue nnue
      - name: Visualizer HTTP, control surface and independent evaluation
        run: bash tools/viz_smoke.sh build/bin/ChessEngine-viz build/bin/ChessEngine-nnue
      - name: Tournament binaries stay independent of visualizer dependencies
        run: |
          for target in ChessEngine ChessEngine-nnue; do
            if grep -qE 'chess_viz|httplib|nlohmann' "build/CMakeFiles/$target.dir/link.txt"; then
              echo "$target picked up a visualizer dependency"
              cat "build/CMakeFiles/$target.dir/link.txt"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            build/bin/ChessEngine
            build/bin/ChessEngine-nnue
            build/bin/ChessEngine-validator

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: viz-wire-fixture
          path: build/viz_frame.bin
          if-no-files-found: error
          retention-days: 7

  arm-neon-nnue:
    name: arm · neon nnue (simd==scalar) + bench
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # +dotprod defines __ARM_FEATURE_DOTPROD so the SDOT dot() path is built
      # (ARMv8.2+; the CI runners are Graviton/Ampere-class).
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" && cmake --build build -j
      - name: NEON == scalar (bit-exact NNUE inference)
        run: ./build/bin/test_zobrist nnue
      - name: classical bench signature (build-independent)
        run: bash tools/bench_signature.sh ./build/bin/ChessEngine
      - name: nnue bench signature (build-independent)
        run: bash tools/bench_signature.sh ./build/bin/ChessEngine-nnue nnue

  portability:
    name: portability · ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: clang, cxx: clang++, id: linux-clang }
          - { os: macos-latest,                            id: macos-arm64 }
          - { os: windows-latest,                          id: windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure & build (Unix)
        if: runner.os != 'Windows'
        run: |
          EXTRA=()
          if [ -n "${{ matrix.cxx }}" ]; then EXTRA+=("-DCMAKE_C_COMPILER=${{ matrix.cc }}" "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF "${EXTRA[@]}"
          cmake --build build -j
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 180
      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build && cmake --build build --config Release
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --timeout 180

  # Visualizer dependencies must stay out of the tournament binaries.
  viz-ui:
    name: viz · ui types, wire contract, bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned to the major the committed bundle was produced with: bundler
      # output is only reproducible for a fixed toolchain, and this job diffs
      # the result byte for byte.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: viz-wire-fixture
          path: ${{ runner.temp }}/wire
      - name: C++ <-> TypeScript wire contract from the tested native build
        env:
          VIZ_FIXTURE: ${{ runner.temp }}/wire/viz_frame.bin
        run: npm test
        working-directory: ui

      - name: Rebuild the bundle and diff it against the committed one
        working-directory: ui
        run: |
          cp dist/index.html /tmp/committed.html
          npm run build
          if ! cmp -s dist/index.html /tmp/committed.html; then
            echo "ui/dist/index.html is stale -- run 'npm run build' in ui/ and commit the result"
            exit 1
          fi
          echo "bundle matches the sources"

  viz-wasm:
    name: viz · wasm build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '6.0.12'
          actions-cache-folder: emsdk-cache
      - run: emcc --version
      - name: Build the WebAssembly engine
        run: bash tools/build_wasm.sh
      - name: The deployable set must be complete
        run: |
          cd ui/dist-wasm
          for f in stk-engine.js stk-engine.wasm stk-vector-64.nnue coi-serviceworker.js index.html; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
          done
          # The page must load the cross-origin-isolation shim before the engine,
          # or SharedArrayBuffer (and so pthreads) is unavailable.
          grep -q 'coi-serviceworker.js' index.html
          cmp stk-vector-64.nnue ../../nets/stk-vector-64.nnue
          ls -la

  clang-format:
    name: lint · clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install clang-format-18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting (whole tree, excluding vendored code)
        run: git ls-files '*.cpp' '*.h' | grep -v '^third_party/fathom/' | xargs clang-format-18 --dry-run --Werror

  clang-tidy:
    name: lint · clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install clang-tidy-18
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - name: Configure (export compile commands)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DENGINE_NATIVE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on engine sources
        run: >
          git ls-files 'src/*.cpp' 'app/*.cpp'
          | xargs clang-tidy-18 -p build
          --warnings-as-errors='bugprone-*,performance-*,modernize-*'

  sanitizers:
    name: safety · asan + ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug -DENGINE_LTO=OFF -DENGINE_NATIVE=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          && cmake --build build -j
      - run: ./build/bin/test_zobrist
      - run: printf "setoption name Threads value 1\nbench 8\nquit\n" | ./build/bin/ChessEngine

  lint:
    name: python · ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-dev.txt && python -m ruff check .

  types:
    name: python · mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-dev.txt && python -m mypy tools tests/python tests/docs examples

  training-smoke:
    name: python · full suite and STK-HalfKA parity
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.11' }
      - run: python -m pip install pytest numpy && python -m pip install 'torch>=2.2,<2.6' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-linux
          path: tested-bin
      - run: chmod +x tested-bin/* && command -v pwsh
      - name: Build standard engine without test targets
        run: |
          cmake -S . -B build -DENGINE_VIZ=OFF -DENGINE_VARIANTS=OFF -DENGINE_NATIVE=OFF -DBUILD_TESTING=OFF
          cmake --build build --target ChessEngine -j2
          ctest --test-dir build -N | grep -q 'Total Tests: 0'
      - name: Full Python and executable-documentation suite
        env:
          ENGINE_BIN: ${{ github.workspace }}/build/bin/ChessEngine
          VALIDATOR_BIN: ${{ github.workspace }}/tested-bin/ChessEngine-validator
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m pytest --junitxml=python-results.xml -v
          python -c "import xml.etree.ElementTree as E; r=E.parse('python-results.xml'); assert not r.findall('.//skipped'), 'Applicable tests were skipped'"


  workflow-lint:
    name: lint · workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -pyflakes='

  checks:
    name: CI complete
    if: always()
    needs: [build, arm-neon-nnue, portability, viz-ui, viz-wasm, clang-format, clang-tidy, sanitizers, lint, types, training-smoke, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('CI jobs failed, were cancelled or skipped: ' + ', '.join(failed))
          PY
