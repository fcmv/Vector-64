name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Reuse one build so correctness checks run the same binaries.
  build:
    name: build · linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ENGINE_NATIVE=OFF: this artifact is downloaded and executed by the
      # correctness jobs below, which land on *different* runner CPUs. A
      # -march=native build would bake in the build runner's ISA and SIGILL on
      # any older downstream runner. The portable baseline (magic bitboards +
      # scalar NNUE via the compile-time fallbacks) runs everywhere and keeps
      # the same deterministic node counts.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF && cmake --build build -j
      - uses: actions/upload-artifact@v7
        with:
          name: engine-linux
          path: |
            build/bin/ChessEngine
            build/bin/ChessEngine-nnue
            build/bin/test_zobrist

  perft-startpos:
    name: perft · startpos
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" 1 20
          ./ChessEngine --perft-one "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" 3 8902
          ./ChessEngine --perft-one "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" 5 4865609

  perft-kiwipete:
    name: perft · kiwipete
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1" 3 97862
          ./ChessEngine --perft-one "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1" 5 193690690

  perft-position3:
    name: perft · position 3 (endgame)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1" 5 674624
          ./ChessEngine --perft-one "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1" 6 11030083

  perft-position4:
    name: perft · position 4 (promotions)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1" 4 422333
          ./ChessEngine --perft-one "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1" 5 15833292

  perft-position5:
    name: perft · position 5
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "rnbq1k1r/pp1Pbppp/2p5/8/2B5/8/PPP1NnPP/RNBQK2R w KQ - 1 8" 4 2103487

  perft-position6:
    name: perft · position 6
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          ./ChessEngine --perft-one "r4rk1/1pp1qppp/p1np1n2/2b1p1B1/2B1P1b1/P1NP1N2/1PP1QPPP/R4RK1 w - - 0 10" 4 3894594

  nnue-bitexact:
    name: nnue · simd == scalar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: chmod +x test_zobrist && ./test_zobrist nnue

  state-consistency:
    name: state · make/unmake + movegen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: chmod +x test_zobrist && ./test_zobrist games

  bench-signature:
    name: search · bench signature
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: chmod +x ChessEngine && bash tools/bench_signature.sh ./ChessEngine

  bench-signature-nnue:
    name: search · bench signature (nnue binary)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      # The NNUE binary embeds nets/stk-vector-64.nnue; its bench node count is
      # a fingerprint of (search + that net). SIMD==scalar bit-exactness makes it
      # build-independent, like the classical signature.
      - run: chmod +x ChessEngine-nnue && bash tools/bench_signature.sh ./ChessEngine-nnue nnue

  # Real ARM runners exercise SDOT; x86 jobs cannot cover the NEON kernels.
  arm-neon-nnue:
    name: arm · neon nnue (simd==scalar) + bench
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # +dotprod defines __ARM_FEATURE_DOTPROD so the SDOT dot() path is built
      # (ARMv8.2+; the CI runners are Graviton/Ampere-class).
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" && cmake --build build -j
      - name: NEON == scalar (bit-exact NNUE inference)
        run: ./build/bin/test_zobrist nnue
      - name: classical bench signature (build-independent)
        run: bash tools/bench_signature.sh ./build/bin/ChessEngine
      - name: nnue bench signature (build-independent)
        run: bash tools/bench_signature.sh ./build/bin/ChessEngine-nnue nnue

  uci-protocol:
    name: uci · protocol
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          python -m pip install pytest
          ENGINE_BIN=$PWD/ChessEngine python -m pytest tests/python/test_uci_behavior.py -v -k "handshake or isready or ucinewgame or startpos_returns"

  uci-mates:
    name: uci · mate / stalemate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          python -m pip install pytest
          ENGINE_BIN=$PWD/ChessEngine python -m pytest tests/python/test_uci_behavior.py -v -k "mate or stalemate or checkmate"

  uci-rules:
    name: uci · rules (promotion / searchmoves / illegal)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          python -m pip install pytest
          ENGINE_BIN=$PWD/ChessEngine python -m pytest tests/python/test_uci_behavior.py -v -k "illegal or promotion or searchmoves"

  uci-limits:
    name: uci · search limits
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/download-artifact@v8
        with: { name: engine-linux }
      - run: |
          chmod +x ChessEngine
          python -m pip install pytest
          ENGINE_BIN=$PWD/ChessEngine python -m pytest tests/python/test_uci_behavior.py -v -k "nodes_limit or bench_signature"

  portability:
    name: portability · ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: clang, cxx: clang++, id: linux-clang }
          - { os: macos-latest,                            id: macos-arm64 }
          - { os: windows-latest,                          id: windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure & build (Unix)
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          if [ -n "${{ matrix.cxx }}" ]; then EXTRA="-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"; fi
          if [ "${{ runner.os }}" = "macOS" ]; then EXTRA="$EXTRA -DENGINE_NATIVE=OFF"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build build -j
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build && cmake --build build --config Release
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

  # Visualizer dependencies must stay out of the tournament binaries.
  viz:
    name: viz · stream + dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build engine + visualizer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF
          cmake --build build --target ChessEngine ChessEngine-nnue ChessEngine-viz test_viz -j
      - name: Telemetry is exact and the session drives legal games
        run: |
          $GITHUB_WORKSPACE/build/bin/test_viz frame
          $GITHUB_WORKSPACE/build/bin/test_viz session
      # Fixed openings expose missing move variety; resuming must not duplicate dataset rows.
      - name: Self-play varies and datagen shards resume cleanly
        run: |
          $GITHUB_WORKSPACE/build/bin/test_viz variety
          $GITHUB_WORKSPACE/build/bin/test_viz shards
      - name: Stream, control surface, security posture, eval cross-check
        run: bash tools/viz_smoke.sh build/bin/ChessEngine-viz build/bin/ChessEngine-nnue
      - name: Tournament binaries stay dependency-free
        run: |
          # The whole point of keeping chess_viz separate: no httplib, no json,
          # no viz code in the engines used for real play.
          for t in ChessEngine ChessEngine-nnue; do
            if grep -qE 'chess_viz|httplib|nlohmann' "build/CMakeFiles/$t.dir/link.txt"; then
              echo "$t picked up a visualizer dependency:"; cat "build/CMakeFiles/$t.dir/link.txt"; exit 1
            fi
          done
          echo "ChessEngine and ChessEngine-nnue link chess_core only"

  viz-ui:
    name: viz · ui types, wire contract, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the major the committed bundle was produced with: bundler
      # output is only reproducible for a fixed toolchain, and this job diffs
      # the result byte for byte.
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui

      # Generate the wire fixture with the C++ encoder so decoder drift fails here.
      - name: Build the fixture generator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF
          cmake --build build --target test_viz -j
      - name: C++ <-> TypeScript wire contract
        # The binary is built at the repo root; npm runs in ui/. Use an absolute
        # path so working-directory cannot make one of them look in the wrong place.
        run: |
          "$GITHUB_WORKSPACE/build/bin/test_viz" fixture "$RUNNER_TEMP/frame.bin"
          VIZ_FIXTURE="$RUNNER_TEMP/frame.bin" npm test
        working-directory: ui

      - name: Rebuild the bundle and diff it against the committed one
        working-directory: ui
        run: |
          cp dist/index.html /tmp/committed.html
          npm run build
          if ! cmp -s dist/index.html /tmp/committed.html; then
            echo "ui/dist/index.html is stale -- run 'npm run build' in ui/ and commit the result"
            exit 1
          fi
          echo "bundle matches the sources"

  viz-wasm:
    name: viz · wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin emsdk after validating a specific version; this build currently tracks latest.
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - run: emcc --version
      - name: Build the WebAssembly engine
        run: bash tools/build_wasm.sh
      - name: The deployable set must be complete
        run: |
          cd ui/dist-wasm
          for f in stk-engine.js stk-engine.wasm stk-vector-64.nnue coi-serviceworker.js index.html; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
          done
          # The page must load the cross-origin-isolation shim before the engine,
          # or SharedArrayBuffer (and so pthreads) is unavailable.
          grep -q 'coi-serviceworker.js' index.html
          [ "$(stat -c%s stk-vector-64.nnue)" = "$(stat -c%s ../../nets/stk-vector-64.nnue)" ]
          ls -la

  clang-format:
    name: lint · clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting (whole tree, excluding vendored code)
        run: git ls-files '*.cpp' '*.h' | grep -v '^third_party/fathom/' | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: lint · clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy-18
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - name: Configure (export compile commands)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DENGINE_NATIVE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on engine sources
        run: >
          git ls-files 'src/*.cpp' 'app/*.cpp'
          | xargs clang-tidy-18 -p build
          --warnings-as-errors='bugprone-*,performance-*,modernize-*'

  sanitizers:
    name: safety · asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug -DENGINE_LTO=OFF -DENGINE_NATIVE=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          && cmake --build build -j
      - run: ./build/bin/test_zobrist
      - run: printf "setoption name Threads value 1\nbench 8\nquit\n" | ./build/bin/ChessEngine

  lint:
    name: python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - run: python -m pip install -r requirements-dev.txt && python -m ruff check tools tests

  types:
    name: python · mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - run: python -m pip install -r requirements-dev.txt && python -m mypy tools tests/python

  unit:
    name: python · unit (STK-HalfKA contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - run: python -m pip install pytest numpy && python -m pytest tests/python/test_feature_encoding.py tests/python/test_nnue_data.py tests/python/test_nnue_match.py tests/python/test_benchmark.py tests/python/test_benchmark_matrix.py tests/python/test_benchmark_wrapper.py -v

  training-smoke:
    name: python · STK-HalfKA training parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: python -m pip install pytest numpy && python -m pip install 'torch>=2.2,<2.6' --index-url https://download.pytorch.org/whl/cpu
      - name: Build standard engine without test targets
        run: |
          cmake -S . -B build -DENGINE_VIZ=OFF -DENGINE_VARIANTS=OFF -DENGINE_NATIVE=OFF -DBUILD_TESTING=OFF
          cmake --build build --target ChessEngine -j2
          ctest --test-dir build -N | grep -q 'Total Tests: 0'
      - run: ENGINE_BIN=$PWD/build/bin/ChessEngine python -m pytest tests/python/test_nnue_training.py tests/python/test_perft_divide.py tests/python/test_tool_entrypoints.py -v
