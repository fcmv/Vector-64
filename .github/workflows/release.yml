name: Release

# Use fixed ISA levels so release binaries run beyond the build runner's CPU.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allow manual dry-runs

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64-v3 = AVX2 + BMI2 → PEXT bitboards + AVX2 NNUE (2015+ CPUs)
          - { os: ubuntu-latest,    asset: STK-Vector-64-linux-x86-64-v3,        flags: "-DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS=-march=x86-64-v3" }
          # x86-64-v2 = SSE4.2 + POPCNT → magic bitboards + scalar NNUE (2009+)
          - { os: ubuntu-latest,    asset: STK-Vector-64-linux-x86-64-v2,        flags: "-DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS=-march=x86-64-v2" }
          - { os: ubuntu-24.04-arm, asset: STK-Vector-64-linux-arm64,            flags: "-DENGINE_NATIVE=OFF" }
          # ARMv8.2 + dot-product: the NNUE binary uses the SDOT kernels. Shipped
          # alongside the v8.0 baseline above (which keeps the vmull fallback for
          # pre-2016 ARM, e.g. RPi 4), so no one is dropped.
          - { os: ubuntu-24.04-arm, asset: STK-Vector-64-linux-arm64-dotprod,    flags: "-DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod" }
          - { os: macos-latest,     asset: STK-Vector-64-macos-arm64,            flags: "-DENGINE_NATIVE=OFF" }
          # Windows binary is built with MSVC /arch:AVX2 (requires an AVX2 CPU)
          - { os: windows-latest,   asset: STK-Vector-64-windows-x86-64-avx2.exe, flags: "" }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure & build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
          cmake --build build -j

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Sanity check (perft)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=build/bin/Release/ChessEngine.exe; else EXE=build/bin/ChessEngine; fi
          "$EXE" --perft | grep "0 Failed"

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=build/bin/Release; EXT=.exe
          else BIN=build/bin; EXT=; fi

          # The classical engine takes the bare asset name; the rest get their
          # suffix inserted ahead of any .exe.
          asset="${{ matrix.asset }}"
          base="${asset%.exe}"
          [ "$base" = "$asset" ] && dot="" || dot=".exe"
          cp "$BIN/ChessEngine$EXT" "dist/$asset"

          # nnue embeds the net; all adds drop variants with classical eval in those modes.
          # variants omits the net; validator omits search; viz embeds the net and UI.
          # Some platforms build only a subset of these targets.
          for t in nnue all variants validator viz; do
            src="$BIN/ChessEngine-$t$EXT"
            if [ -f "$src" ]; then
              cp "$src" "dist/${base}-${t}${dot}"
            else
              echo "not built on this platform: ChessEngine-$t"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Each platform ships up to six binaries, named `<platform>` plus the
            suffix below (`.exe` last on Windows).

            | Suffix | What it is |
            |---|---|
            | *(none)* | Classical evaluation, no net. Smallest, most portable. |
            | `-nnue` | Standard chess, net embedded. Strongest at chess. |
            | `-all` | `-nnue` plus crazyhouse and bughouse. **Use this for variants.** |
            | `-variants` | Drop variants on the classical evaluation, no net. Used for SPRT. |
            | `-validator` | Legality, terminal and FEN queries as one-line JSON. No search, no net. |
            | `-viz` | Vector Scope, the live NNUE visualizer. Net and UI in one file. |

            Pick by CPU: `x86-64-v3` needs AVX2 (2015+), `x86-64-v2` needs SSE4.2
            (2009+), `arm64-dotprod` needs ARMv8.2 dot-product.
