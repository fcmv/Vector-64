name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed release commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected a version tag such as v1.1.0 or v1.1.0-rc.1'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 tools/release/require_checks.py --commit "$GITHUB_SHA"
          python3 -m tools.release.publish --check-only --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

  build:
    name: ${{ matrix.asset }}
    needs: preflight
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, asset: STK-Vector-64-linux-x86-64-v3, flags: '-march=x86-64-v3' }
          - { os: ubuntu-24.04, asset: STK-Vector-64-linux-x86-64-v2, flags: '-march=x86-64-v2' }
          - { os: ubuntu-24.04-arm, asset: STK-Vector-64-linux-arm64, flags: '-march=armv8-a' }
          - { os: ubuntu-24.04-arm, asset: STK-Vector-64-linux-arm64-dotprod, flags: '-march=armv8.2-a+dotprod' }
          - { os: macos-15, asset: STK-Vector-64-macos-arm64, flags: '-march=armv8-a' }
          - { os: windows-2025, asset: STK-Vector-64-windows-x86-64-avx2.exe, flags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Configure and build (Unix)
        if: runner.os != 'Windows'
        env:
          ISA_FLAGS: ${{ matrix.flags }}
        run: |
          cmake -S . -B out/build/release -DCMAKE_BUILD_TYPE=Release -DENGINE_NATIVE=OFF -DCMAKE_CXX_FLAGS="$ISA_FLAGS" -DBUILD_TESTING=ON -DENGINE_VARIANTS=ON -DENGINE_VIZ=ON
          cmake --build out/build/release --parallel 3
      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out/build/release -DENGINE_NATIVE=OFF -DBUILD_TESTING=ON -DENGINE_VARIANTS=ON -DENGINE_VIZ=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/build/release --config Release --parallel 3
      - name: Full native correctness suite
        run: ctest --test-dir out/build/release -C Release --output-on-failure --no-tests=error --timeout 180
      - name: Verify the actual release capabilities
        shell: bash
        run: |
          BIN="$GITHUB_WORKSPACE/out/build/release/bin"
          EXT=''
          if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN/Release"; EXT=.exe; fi
          bash tools/bench_signature.sh "$BIN/ChessEngine$EXT"
          bash tools/bench_signature.sh "$BIN/ChessEngine-nnue$EXT" nnue
          for target in ChessEngine ChessEngine-nnue ChessEngine-all ChessEngine-variants; do
            python tests/python/uci_smoke.py "$BIN/$target$EXT"
          done
          python -m pip install 'pytest>=8,<9' 'numpy>=1.23,<3'
          ENGINE_BIN="$BIN/ChessEngine$EXT" VALIDATOR_BIN="$BIN/ChessEngine-validator$EXT" python -m pytest tests/docs -v --junitxml=release-tests.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('release-tests.xml'); assert not r.findall('.//skipped'), 'Release capability tests were skipped'"
          bash tools/viz_smoke.sh "$BIN/ChessEngine-viz$EXT" "$BIN/ChessEngine-nnue$EXT"
      - name: Stage all six binaries and build identity
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: python tools/release/package.py stage --build out/build/release --output dist --asset "$ASSET_NAME" --commit "$GITHUB_SHA" --ref "$GITHUB_REF"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  notices:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ui
      - name: Collect exact dependency notices and corresponding source
        run: |
          python tools/release/package.py notices --output dist/release-notices.zip --commit "$GITHUB_SHA"
          git archive --format=tar.gz --prefix=Vector-64/ --output=dist/release-source.tar.gz "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notices
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [build, notices]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete release and checksum final assets
        run: |
          python tools/release/package.py finalize --output dist --commit "$GITHUB_SHA" --assets STK-Vector-64-linux-x86-64-v3 STK-Vector-64-linux-x86-64-v2 STK-Vector-64-linux-arm64 STK-Vector-64-linux-arm64-dotprod STK-Vector-64-macos-arm64 STK-Vector-64-windows-x86-64-avx2.exe
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: dist
      - name: Upload and verify draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release.publish --output dist --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
