name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/require_checks.py --commit "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: python -m pip install -r requirements-docs.txt
      - name: Record build identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('docs/build.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'documentation': 'development with a verified v1.0.0 release guide'
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Build the reviewed documentation
        run: |
          python tools/docs/check_punctuation.py
          python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
